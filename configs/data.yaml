dataset:
  name: "HuggingFaceFW/fineweb-edu"
  config: "sample-10BT"
  split: "train"
  streaming: true

output:
  raw_dir: "data/raw"
  interim_dir: "data/interim"
  processed_dir: "data/processed"

processing:
  max_documents: 10000
  min_characters: 200
  max_characters: 100000
  validation_ratio: 0.01
  seed: 42

quality:
  remove_null_bytes: true
  normalize_whitespace: true

  max_url_ratio: 0.02
  max_email_count: 3
  max_repeated_line_ratio: 0.30
  max_non_printable_ratio: 0.02

  min_alpha_ratio: 0.20
  min_word_count: 40